version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: journex-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: trading_journal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journex-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-mysecretpassword}@db:5432/trading_journal?schema=public
      DIRECT_URL: postgresql://postgres:${DB_PASSWORD:-mysecretpassword}@db:5432/trading_journal?schema=public
      PORT: 5000
      NODE_ENV: production
      BACKEND_URL: http://${VPS_IP:-localhost}:5000
      FRONTEND_URL: http://${VPS_IP:-localhost}:3000
    ports:
      - "5000:5000"
    command: sh -c "npx prisma generate && npx prisma db push && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://${VPS_IP:-localhost}:5000
        NEXT_PUBLIC_API_URL: http://${VPS_IP:-localhost}:3000
        NEXT_PUBLIC_BRIDGE_URL: http://3.104.66.16:5003
        NEXT_PUBLIC_WS_URL: ws://${VPS_IP:-localhost}:5000
    container_name: journex-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://${VPS_IP:-localhost}:5000
      NEXT_PUBLIC_API_URL: http://${VPS_IP:-localhost}:3000
      NEXT_PUBLIC_BRIDGE_URL: http://3.104.66.16:5003
      NEXT_PUBLIC_WS_URL: ws://${VPS_IP:-localhost}:5000

volumes:
  postgres_data:
