services:
  db:
    image: postgres:16-alpine
    container_name: journex-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
      POSTGRES_DB: trading_journal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journex-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-mysecretpassword}@db:5432/trading_journal?schema=public
      DIRECT_URL: postgresql://postgres:${DB_PASSWORD:-mysecretpassword}@db:5432/trading_journal?schema=public
      PORT: 5000
      NODE_ENV: production
      BACKEND_URL: http://${VPS_IP:-localhost}:5000
      FRONTEND_URL: http://${VPS_IP:-localhost}:3000
      MT5_BRIDGE_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
      LOCAL_MT5_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
    ports:
      - "5000:5000"
    command: sh -c "npx prisma generate && npx prisma db push && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://${VPS_IP:-localhost}:5000
        NEXT_PUBLIC_API_URL: http://${VPS_IP:-localhost}:3000
        NEXT_PUBLIC_BRIDGE_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
        NEXT_PUBLIC_WS_URL: ws://${VPS_IP:-localhost}:5000
        INTERNAL_API_URL: http://backend:5000
        BRIDGE_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
    container_name: journex-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-supersecret_random_string_12345}
      AUTH_URL: http://${VPS_IP:-localhost}:3000
      AUTH_TRUST_HOST: "true"
      INTERNAL_API_URL: http://backend:5000
      BRIDGE_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
      NEXT_PUBLIC_BACKEND_URL: http://${VPS_IP:-localhost}:5000
      NEXT_PUBLIC_API_URL: http://${VPS_IP:-localhost}:3000
      NEXT_PUBLIC_BRIDGE_URL: ${BRIDGE_URL:-http://3.104.66.16:5003}
      NEXT_PUBLIC_WS_URL: ws://${VPS_IP:-localhost}:5000

volumes:
  postgres_data:
