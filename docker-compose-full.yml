# Full Stack Setup: Postgres + Backend + Frontend
version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trading-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zipmu3-cEcsak-jifqyf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js)
  backend:
    build: ./backend
    container_name: trading-backend
    environment:
      DATABASE_URL: postgresql://postgres:zipmu3-cEcsak-jifqyf@postgres:5432/trading_journal?schema=public
      DIRECT_URL: postgresql://postgres:zipmu3-cEcsak-jifqyf@postgres:5432/trading_journal?schema=public
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      MT5_BRIDGE_URL: http://host.docker.internal:5003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading_network
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (Next.js)
  frontend:
    build: ./frontend
    container_name: trading-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_BRIDGE_URL: http://localhost:5000/api/bridge
      INTERNAL_API_URL: http://backend:5000
      # We need NextAuth to know its URL
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Pass through the API secret if needed
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-api-secret-key-change-in-prod}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-fallback-secret-change-in-production}
      AUTH_SECRET: ${NEXTAUTH_SECRET:-dev-fallback-secret-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trading_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  trading_network:
    driver: bridge
