# ============================================================
# Railway deployment config — Unified single-service deploy
# One process serves Next.js pages + Express /api + WebSocket
# on the same port (frontend/server.js). One URL, one database.
# ============================================================

[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend && npm run build --prefix backend && npm install --prefix frontend && npm run build --prefix frontend"

[deploy]
startCommand = "node frontend/server.js"
restartPolicyType = "always"
restartPolicyMaxRetries = 5
healthcheckPath = "/health"
healthcheckTimeout = 60
